<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="888" viewBox="0 48 1130 888"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#a33d28" /></marker></defs><rect width="100%" height="888" fill="white" y="48" /><circle cx="75.0" cy="60" r="7" fill="#fff6b5" stroke="#a33d28" /><path d="M75.0,67 v17 m-13,-10 h26 m-13,10 l-11,13 m11,-13 l11,13" stroke="#a33d28" fill="none" /><text x="75.0" y="108.0" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Quản trị viên</text><polyline points="75,125 75,906" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><rect x="253" y="72" width="134" height="53" fill="#fff8ae" stroke="#a33d28" /><text x="320.0" y="94.72999999999999" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Giao diện điều</text><text x="320.0" y="110.58999999999999" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">phối</text><polyline points="320,125 320,906" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><rect x="498" y="72" width="134" height="53" fill="#fff8ae" stroke="#a33d28" /><text x="565.0" y="102.66" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">LichHocController</text><polyline points="565,125 565,906" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><rect x="743" y="72" width="134" height="53" fill="#fff8ae" stroke="#a33d28" /><text x="810.0" y="102.66" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ScheduleRules</text><polyline points="810,125 810,906" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><rect x="988" y="72" width="134" height="53" fill="#fff8ae" stroke="#a33d28" /><text x="1055.0" y="102.66" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">SQL Server</text><polyline points="1055,125 1055,906" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><rect x="19" y="327" width="1092" height="214" fill="none" stroke="#a33d28" /><rect x="19" y="327" width="193" height="23" fill="#fff8ae" stroke="#a33d28" /><text x="27" y="342.66" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold">loop Từng buổi học hợp lệ</text><rect x="19" y="554" width="1092" height="309" fill="none" stroke="#a33d28" /><rect x="19" y="554" width="291" height="23" fill="#fff8ae" stroke="#a33d28" /><text x="27" y="569.66" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold">alt Dữ liệu sai hoặc phát hiện xung đột</text><rect x="34" y="668" width="1062" height="88" fill="none" stroke="#a33d28" /><rect x="34" y="668" width="256" height="23" fill="#fff8ae" stroke="#a33d28" /><text x="42" y="683.66" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold">opt Sức chứa thấp hơn sĩ số tối đa</text><polyline points="75,187 320,187" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="316" y="187" width="8" height="24" fill="#fff8ae" stroke="#a33d28" /><text x="197.5" y="163.23" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">1. Khai báo thứ, tiết, phòng,</text><text x="197.5" y="179.08999999999997" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">giảng viên và tuần</text><polyline points="320,226 565,226" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="561" y="226" width="8" height="105" fill="#fff8ae" stroke="#a33d28" /><text x="442.5" y="218.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">2. Save</text><polyline points="565,265 1055,265" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="1051" y="265" width="8" height="39" fill="#fff8ae" stroke="#a33d28" /><text x="810.0" y="257.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">3. Đọc lớp, học kỳ, phòng và lịch liên quan</text><polyline points="1055,304 565,304" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="810.0" y="296.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">4. Dữ liệu kiểm tra</text><polyline points="565,397 810,397" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="806" y="397" width="8" height="55" fill="#fff8ae" stroke="#a33d28" /><text x="687.5" y="373.23" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">5. Overlaps với các buổi liên</text><text x="687.5" y="389.09000000000003" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">quan</text><polyline points="810,452 565,452" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="687.5" y="428.23" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">6. Cùng thứ, giao khoảng tiết và</text><text x="687.5" y="444.09000000000003" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">giao tuần</text><polyline points="565,507 604,507 604,520 565,520" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><text x="581" y="483.23" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal">7. Đối chiếu phòng, giảng</text><text x="581" y="499.09000000000003" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal">viên và sinh viên</text><polyline points="565,608 320,608" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="442.5" y="600.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">8. Trả lỗi và giữ lịch hiện tại</text><polyline points="19,631 1111,631" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><text x="35" y="649.16" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold">else · Không có lỗi chặn</text><polyline points="565,722 604,722 604,735 565,735" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><text x="581" y="714.16" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal">9. Ghi nhận cảnh báo</text><polyline points="565,785 1055,785" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="1051" y="785" width="8" height="24" fill="#fff8ae" stroke="#a33d28" /><text x="810.0" y="777.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">10. Lưu lịch và commit giao dịch</text><polyline points="565,840 320,840" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="442.5" y="816.23" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">11. Quay về trang điều phối, kèm</text><text x="442.5" y="832.09" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">cảnh báo nếu có</text></svg>
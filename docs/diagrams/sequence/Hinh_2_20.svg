" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="442.5" y="295.23" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">3. Yêu cầu xác thực Portal hoặc</text><text x="442.5" y="311.09000000000003" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">từ chối tra cứu nội bộ</text><polyline points="19,342 1356,342" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><text x="35" y="360.16" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold">else · Được xem hồ sơ</text><polyline points="565,411 810,411" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="806" y="411" width="8" height="39" fill="#fff8ae" stroke="#a33d28" /><text x="687.5" y="387.23" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">4. Đọc kết quả, khung ngành và</text><text x="687.5" y="403.09000000000003" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">quy định</text><polyline points="810,450 565,450" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="687.5" y="442.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">5. Dữ liệu học vụ</text><polyline points="565,489 1055,489" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="1051" y="489" width="8" height="39" fill="#fff8ae" stroke="#a33d28" /><text x="810.0" y="481.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">6. Calculate</text><polyline points="1055,528 565,528" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="810.0" y="520.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">7. GPA và tín chỉ
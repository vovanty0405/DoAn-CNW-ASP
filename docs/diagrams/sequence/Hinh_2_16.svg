304 565,304" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="810.0" y="296.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">4. Dữ liệu sổ và phạm vi lớp</text><polyline points="565,381 320,381" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="442.5" y="373.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">5. Từ chối cập nhật</text><polyline points="19,404 1111,404" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><text x="35" y="422.16" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold">else · Danh sách, giá trị hoặc tỷ lệ không hợp lệ</text><polyline points="565,457 320,457" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="442.5" y="449.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">6. Báo lỗi dữ liệu</text><polyline points="19,480 1111,480" fill="none" stroke="#a33d28" stroke-dasharray="6 4" /><text x="35" y="498.16" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold">else · Dữ liệu hợp lệ</text><polyline points="565,587 604,587 604,600 565,600" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><text x="581" y="563.23" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal">7. Tính điểm quá trình hoặc</text><text x="581" y="579.09" fill="#172339" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="normal">dùng giá trị đã phúc khảo</text><polyline points="565,637 810,637" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="806" y="637" width="8" height="55" fill="#fff8ae" stroke="#a33d28" /><text x="687.5" y="629.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">8. TinhDiemTongKetCuoiCung</text><polyline points="810,692 565,692" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="687.5" y="668.23" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">9. Điểm tổng kết, điểm chữ và</text><text x="687.5" y="684.09" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">ghi chú</text><polyline points="565,744 1055,744" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="1051" y="744" width="8" height="24" fill="#fff8ae" stroke="#a33d28" /><text x="810.0" y="736.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">10. Lưu kết quả và thông báo, commit</text><polyline points="565,783 810,783" fill="none" stroke="#a33d28" marker-end="url(#arrow)" /><rect x="806" y="783" width="8" height="24" fill="#fff8ae" stroke="#a33d28" /><text x="687.5" y="775.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">11. GhiNhatKy</text><polyline points="565,822 320,822" fill="none" stroke="#a33d28" stroke-dasharray="6 4" marker-end="url(#arrow)" /><text x="442.5" y="814.16" fill="#172339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal">12. Kết quả lưu thành công</text></svg>